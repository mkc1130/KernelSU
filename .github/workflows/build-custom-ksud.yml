name: Build custom ksud (m3q LKM + v3.3.0 userspace)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Checkout v3.3.0 source with m3q .ko
      run: |
        # Keep the m3q-specific .ko from main branch
        cp userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko /tmp/m3q_kernelsu.ko
        git checkout v3.3.0
        cp /tmp/m3q_kernelsu.ko userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko
        echo "=== Embedded .ko ==="
        ls -la userspace/ksud/bin/aarch64/
        sha256sum userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko

    - name: Setup Rust
      run: |
        rustup update stable
        rustup target add aarch64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cargo build --target aarch64-linux-android --release \
          --manifest-path ./userspace/ksud/Cargo.toml

    - name: Upload ksud
      uses: actions/upload-artifact@v7
      with:
        name: ksud-m3q-v3.3.0
        path: target/aarch64-linux-android/release/ksud
