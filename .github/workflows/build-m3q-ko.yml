name: Build m3q KernelSU ko

on:
  workflow_dispatch:

jobs:
  build-ko:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: v3.3.0
        fetch-depth: 0

    - name: Download Samsung kernel source
      run: |
        gh release download kernel-source -p "Kernel.tar.gz" -D /tmp/
        ls -lh /tmp/Kernel.tar.gz
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Extract kernel source
      run: |
        mkdir -p /tmp/samsung
        cd /tmp/samsung
        tar xzf /tmp/Kernel.tar.gz ./kernel_platform/common/ --strip-components=0
        rm /tmp/Kernel.tar.gz
        echo "=== Kernel source extracted ==="
        ls /tmp/samsung/kernel_platform/common/

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          build-essential bc flex bison libssl-dev libelf-dev

    - name: Configure kernel
      run: |
        cd /tmp/samsung/kernel_platform/common
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
        ./scripts/kconfig/merge_config.sh -m .config galaxy_ogki_defconfig
        ./scripts/config --enable CONFIG_MODULES
        ./scripts/config --enable CONFIG_MODULE_UNLOAD
        ./scripts/config --disable CONFIG_MODVERSIONS
        ./scripts/config --disable CONFIG_MODULE_SIG
        ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
        ./scripts/config --set-str CONFIG_LOCALVERSION "-android16-5-pd30ff70-abogkiS948NKSS4AZG3-4k"
        ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        echo "=== Config ==="
        grep -E 'CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_MODVERSIONS' .config

    - name: Prepare kernel for module building
      run: |
        cd /tmp/samsung/kernel_platform/common
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

    - name: Build KernelSU ko
      run: |
        KDIR=/tmp/samsung/kernel_platform/common
        KSRC=$GITHUB_WORKSPACE/kernel
        cd $KSRC
        make -C $KDIR \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          M=$KSRC \
          src=$KSRC \
          CONFIG_KSU=m \
          modules -j$(nproc)
        echo "=== Build result ==="
        ls -la $KSRC/kernelsu.ko
        file $KSRC/kernelsu.ko

    - name: Verify and patch vermagic
      run: |
        KSRC=$GITHUB_WORKSPACE/kernel
        TARGET="6.12.30-android16-5-pd30ff70-abogkiS948NKSS4AZG3-4k SMP preempt mod_unload modversions aarch64"
        CURRENT=$(strings $KSRC/kernelsu.ko | grep -oP '6\.12\.\d+\S* SMP.*aarch64' | head -1)
        echo "Current: $CURRENT"
        echo "Target:  $TARGET"
        if [ "$CURRENT" != "$TARGET" ]; then
          echo "Patching vermagic..."
          python3 -c "
import sys
p='$KSRC/kernelsu.ko'
with open(p,'rb') as f: d=f.read()
o=b'$CURRENT\x00'
n=b'$TARGET\x00'
if len(n)>len(o): n=n[:len(o)]
else: n=n.ljust(len(o),b'\x00')
d=d.replace(o,n,1)
with open(p,'wb') as f: f.write(d)
print('Patched')
"
          PATCHED=$(strings $KSRC/kernelsu.ko | grep -oP '6\.12\.\d+\S* SMP.*aarch64' | head -1)
          echo "Patched: $PATCHED"
        fi

    - name: Show ko details
      run: |
        KSRC=$GITHUB_WORKSPACE/kernel
        ls -la $KSRC/kernelsu.ko
        sha256sum $KSRC/kernelsu.ko
        aarch64-linux-gnu-objdump -h $KSRC/kernelsu.ko | head -30

    - name: Upload ko
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-v330-m3q-ko
        path: kernel/kernelsu.ko

  build-ksud:
    needs: build-ko
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download built ko
      uses: actions/download-artifact@v4
      with:
        name: kernelsu-v330-m3q-ko
        path: /tmp/

    - name: Prepare v330 source with new ko
      run: |
        cp /tmp/kernelsu.ko userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko
        git checkout v3.3.0 -- userspace/ksud/
        cp /tmp/kernelsu.ko userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko
        ls -la userspace/ksud/bin/aarch64/
        sha256sum userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko

    - name: Setup Rust
      run: |
        rustup update stable
        rustup target add aarch64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cargo build --target aarch64-linux-android --release \
          --manifest-path ./userspace/ksud/Cargo.toml

    - name: Upload ksud
      uses: actions/upload-artifact@v4
      with:
        name: ksud-m3q-v330-newko
        path: target/aarch64-linux-android/release/ksud
