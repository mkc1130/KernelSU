name: Build KernelSU v3.3.0 .ko for SM-S948N (m3q)

on:
  workflow_dispatch:

jobs:
  build-ko:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: v3.3.0
        fetch-depth: 0

    - name: Download Samsung kernel source
      run: |
        gh release download kernel-source -p "Kernel.tar.gz" -D /tmp/
        ls -lh /tmp/Kernel.tar.gz
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Extract kernel source
      run: |
        mkdir -p /tmp/samsung
        cd /tmp/samsung
        tar xzf /tmp/Kernel.tar.gz ./kernel_platform/common/ --strip-components=0
        rm /tmp/Kernel.tar.gz
        echo "=== Kernel source extracted ==="
        ls /tmp/samsung/kernel_platform/common/
        head -5 /tmp/samsung/kernel_platform/common/Makefile

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          build-essential bc flex bison libssl-dev libelf-dev

    - name: Configure kernel
      run: |
        cd /tmp/samsung/kernel_platform/common
        # Start with GKI defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
        # Merge Samsung overlay
        ./scripts/kconfig/merge_config.sh -m .config galaxy_ogki_defconfig
        # Ensure KSU-relevant configs
        ./scripts/config --enable CONFIG_MODULES
        ./scripts/config --enable CONFIG_MODULE_UNLOAD
        ./scripts/config --disable CONFIG_MODVERSIONS
        ./scripts/config --disable CONFIG_MODULE_SIG
        ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
        # Set LOCALVERSION to match AZG3 vermagic base
        ./scripts/config --set-str CONFIG_LOCALVERSION "-android16-5-pd30ff70-abogkiS948NKSS4AZG3-4k"
        ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        echo "=== Kernel config ready ==="
        grep -E 'CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG' .config

    - name: Prepare kernel for module building
      run: |
        cd /tmp/samsung/kernel_platform/common
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
        echo "=== modules_prepare done ==="

    - name: Build KernelSU .ko
      run: |
        KDIR=/tmp/samsung/kernel_platform/common
        KSRC=$GITHUB_WORKSPACE/kernel
        cd $KSRC

        # Build as out-of-tree module
        make -C $KDIR \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          M=$KSRC \
          src=$KSRC \
          CONFIG_KSU=m \
          modules -j$(nproc)

        echo "=== Build result ==="
        ls -la $KSRC/kernelsu.ko
        file $KSRC/kernelsu.ko

    - name: Verify and patch vermagic
      run: |
        KSRC=$GITHUB_WORKSPACE/kernel
        TARGET_VERMAGIC="6.12.30-android16-5-pd30ff70-abogkiS948NKSS4AZG3-4k SMP preempt mod_unload modversions aarch64"

        # Check current vermagic
        CURRENT=$(modinfo -F vermagic $KSRC/kernelsu.ko 2>/dev/null || \
          strings $KSRC/kernelsu.ko | grep -oP '6\.12\.\d+\S* SMP.*aarch64' | head -1)
        echo "Current vermagic: $CURRENT"
        echo "Target  vermagic: $TARGET_VERMAGIC"

        if [ "$CURRENT" != "$TARGET_VERMAGIC" ]; then
          echo "Patching vermagic..."
          python3 - "$KSRC/kernelsu.ko" "$CURRENT" "$TARGET_VERMAGIC" <<'PYEOF'
import sys
ko_path, old_vm, new_vm = sys.argv[1], sys.argv[2], sys.argv[3]
with open(ko_path, 'rb') as f:
    data = f.read()
old_bytes = old_vm.encode('ascii') + b'\x00'
new_bytes = new_vm.encode('ascii') + b'\x00'
if len(new_bytes) > len(old_bytes):
    print(f"ERROR: new vermagic ({len(new_bytes)}) longer than old ({len(old_bytes)})")
    sys.exit(1)
new_bytes = new_bytes.ljust(len(old_bytes), b'\x00')
if old_bytes not in data:
    print(f"ERROR: old vermagic not found in binary")
    sys.exit(1)
data = data.replace(old_bytes, new_bytes, 1)
with open(ko_path, 'wb') as f:
    f.write(data)
print("Vermagic patched successfully")
PYEOF
          # Verify
          PATCHED=$(strings $KSRC/kernelsu.ko | grep -oP '6\.12\.\d+\S* SMP.*aarch64' | head -1)
          echo "Patched vermagic: $PATCHED"
        fi

    - name: Show .ko details
      run: |
        KSRC=$GITHUB_WORKSPACE/kernel
        echo "=== File info ==="
        ls -la $KSRC/kernelsu.ko
        file $KSRC/kernelsu.ko
        sha256sum $KSRC/kernelsu.ko
        echo "=== modinfo ==="
        modinfo $KSRC/kernelsu.ko 2>/dev/null || true
        echo "=== Sections ==="
        aarch64-linux-gnu-objdump -h $KSRC/kernelsu.ko | head -30

    - name: Upload .ko
      uses: actions/upload-artifact@v7
      with:
        name: kernelsu-v3.3.0-m3q-ko
        path: kernel/kernelsu.ko

  build-ksud:
    needs: build-ko
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download built .ko
      uses: actions/download-artifact@v7
      with:
        name: kernelsu-v3.3.0-m3q-ko
        path: /tmp/

    - name: Prepare v3.3.0 source with new .ko
      run: |
        cp /tmp/kernelsu.ko userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko
        git checkout v3.3.0 -- userspace/ksud/
        cp /tmp/kernelsu.ko userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko
        echo "=== Embedded .ko ==="
        ls -la userspace/ksud/bin/aarch64/
        sha256sum userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko

    - name: Setup Rust
      run: |
        rustup update stable
        rustup target add aarch64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cargo build --target aarch64-linux-android --release \
          --manifest-path ./userspace/ksud/Cargo.toml

    - name: Upload ksud
      uses: actions/upload-artifact@v7
      with:
        name: ksud-m3q-v3.3.0-newko
        path: target/aarch64-linux-android/release/ksud
